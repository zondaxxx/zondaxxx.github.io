<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZONDAXXX</title>
<meta name="description" content="Визитка. Ghostface в стиле PS1.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath fill='%23eee6d2' d='M5 2h6v1h1v2h1v7h-1v2h-1v1H5v-1H4v-2H3V5h1V3h1z'/%3E%3Cpath fill='%23000' d='M5 5h2v2H5zM9 5h2v2H9zM7 9h2v4H7z'/%3E%3C/svg%3E">
</head>
<body>

<!-- 3D: PS1 Ghostface -->
<canvas id="gl" aria-hidden="true"></canvas>

<!-- CRT overlays -->
<div class="crt-scan" aria-hidden="true"></div>
<div class="crt-vignette" aria-hidden="true"></div>

<!-- Boot screen -->
<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-logo">GHOST<span>FACE</span></div>
    <div class="boot-sub">MEMORY CARD (PS1/SLOT 1) &middot; OK</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div class="boot-status" id="boot-status">NOW LOADING&hellip;</div>
    <button class="boot-start" id="boot-start" hidden>PRESS START</button>
  </div>
</div>

<!-- Content -->
<main class="ui" id="ui">
  <header class="hero">
    <div class="tag" id="tag">&gt; WHAT'S YOUR FAVORITE SCARY MOVIE?</div>
    <h1 class="name" id="name" data-text="ZONDAXXX">ZONDAXXX</h1>
    <p class="about" id="about">разработчик · сети · железо</p>
  </header>

  <nav class="menu" id="menu" aria-label="Контакты"></nav>

  <footer class="foot">
    <span id="year"></span> &middot; low-poly &middot; 320&times;240 &middot; <span class="blink">_</span>
  </footer>
</main>

<div class="hint" id="hint" aria-hidden="true">мышь: посмотреть &middot; клик: удар</div>

<noscript><p class="nojs">Включи JavaScript, тут 3D.</p></noscript>

<script type="module" src="main.js?v=3"></script>
</body>
</html>
